<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generar hash de credenciales · Casa Cuauhtémoc</title>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-screen">
    <form class="login-card" id="form" style="max-width:440px">
      <h1>Generar hash de credenciales</h1>
      <p class="login-sub">Úsalo para cambiar usuario/contraseña sin exponerlos en el código.</p>

      <label class="field"><span>Salt (debe coincidir con config.js)</span>
        <input type="text" id="salt" value="cc_casa_cuauhtemoc_v1_8f3a" /></label>
      <label class="field"><span>Usuario</span>
        <input type="text" id="user" value="paul_casa" autocapitalize="none" /></label>
      <label class="field"><span>Nueva contraseña</span>
        <input type="text" id="pass" placeholder="escribe la contraseña" /></label>

      <button type="submit" class="btn btn-primary btn-block">Generar hash</button>

      <div class="field" style="margin-top:8px">
        <span>Pega esto en config.js → auth.passwordHash</span>
        <textarea id="out" rows="3" readonly placeholder="el hash aparecerá aquí"></textarea>
      </div>
      <p class="hint">Recuerda también actualizar <strong>auth.username</strong> y <strong>auth.salt</strong> si los cambiaste, y usar el mismo salt en el Apps Script.</p>
    </form>
  </div>

  <script type="module">
    import { hashCredential } from "./js/crypto.js";
    const form = document.getElementById("form");
    form.onsubmit = async (e) => {
      e.preventDefault();
      const salt = document.getElementById("salt").value;
      const user = document.getElementById("user").value.trim();
      const pass = document.getElementById("pass").value;
      document.getElementById("out").value = await hashCredential(salt, user, pass);
    };
  </script>
</body>
</html>
